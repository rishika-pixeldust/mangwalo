<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MangWalo — maang lo! A local-first noticeboard to borrow and lend everyday things within your Mumbai neighborhood. No account, no server — your data never leaves your device.">
  <meta name="theme-color" content="#F2793C">

  <!-- Open Graph -->
  <meta property="og:title" content="MangWalo — neighborhood borrow &amp; lend">
  <meta property="og:description" content="Maang lo! Borrow and lend everyday things within your neighborhood. Local-first: your data never leaves your device.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MangWalo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MangWalo — neighborhood borrow &amp; lend</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Warm splash while the Flutter engine loads. */
    html, body { height: 100%; margin: 0; }
    #mw-splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #F3EEE6;
      color: #F2793C;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #mw-splash .mark {
      width: 72px; height: 72px; border-radius: 18px;
      background: #F2793C; color: #FFF8F3;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      #mw-splash { background: #171310; }
    }
  </style>
</head>
<body>
  <div id="mw-splash" aria-label="MangWalo is loading">
    <div class="mark">M</div>
    <div>MangWalo</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('mw-splash');
      if (splash) { splash.remove(); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
